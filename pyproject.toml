[project]
name = "soundcloud-downloader"
version = "0.1.0"
description = "Soundcloud Downloader"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.2.4",
    "python-telegram-bot>=22.8",
    "yt-dlp>=2026.8.19",
    "mutagen>=1.47.0",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
